name: ttc-closure-bets
services:
  web:
    build:
      context: .
      args:
        VERSION: ${IMAGE_TAG:-v1.0.0}
        REVISION: ${IMAGE_REVISION:-unknown}
        CREATED: ${IMAGE_CREATED:-unknown}
    image: ttc-closure-bets:${IMAGE_TAG:-v1.0.0}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp/app:size=16m,mode=1770,uid=1000,gid=1000
    volumes:
      - ttc-data:/data
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://toronto-transit.org}
    networks:
      - origin
      - egress
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.75
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  tunnel:
    image: cloudflare/cloudflared:2026.8.0@sha256:2535e54b16adf1d50630f99d0886471926c5ef3f6b328100ec6589f731c48969
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/tunnel_token"]
    secrets:
      - tunnel_token
    networks:
      - origin
      - egress
    depends_on:
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.25
networks:
  origin:
    internal: true
  egress:
volumes:
  ttc-data:
secrets:
  tunnel_token:
    file: ./secrets/tunnel-token.txt
